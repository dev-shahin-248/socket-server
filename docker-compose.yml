version: "3.8"

services:
  socket-server:
    build: .
    container_name: socket-server
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reload
      - .:/usr/src/app:cached
      # Use named volume for node_modules to preserve container's modules
      - node_modules:/usr/src/app/node_modules
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # For better file watching in Docker
      - DEBUG=socket.io:*
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - socket-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000", "||" , "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a database service if needed later
  # redis:
  #   image: redis:7-alpine
  #   container_name: socket-redis
  #   restart: unless-stopped
  #   networks:
  #     - socket-network
  #   volumes:
  #     - redis-data:/data

volumes:
  node_modules:
  # redis-data:

networks:
  socket-network:
    driver: bridge
